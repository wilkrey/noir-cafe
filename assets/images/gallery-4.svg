      <stop offset="0%" stop-color="#1d1512"/>
      <stop offset="100%" stop-color="#0b0806"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#e9cf9a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0806" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <!-- Заварочный стол -->
  <rect x="80" y="620" width="640" height="24" rx="4" fill="#3a2b23"/>
  <rect x="120" y="644" width="16" height="250" fill="#241a14"/>
  <rect x="664" y="644" width="16" height="250" fill="#241a14"/>
